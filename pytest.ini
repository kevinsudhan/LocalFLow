[pytest]
testpaths = tests
# The backend is a plain package rather than an installed distribution, so the
# documented `python -m pytest` needs it on the path to import `localflow`.
pythonpath = backend
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
markers =
    slow: needs models loaded or network
